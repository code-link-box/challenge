<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>挑戦ボード</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Noto Sans JP -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithRedirect, getRedirectResult, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBHjBXbPCD1Q7_xT7mu7eIjEimIKxQzxrs",
            authDomain: "fire-board-b1a21.firebaseapp.com",
            projectId: "fire-board-b1a21",
            storageBucket: "fire-board-b1a21.firebasestorage.app",
            messagingSenderId: "433131318113",
            appId: "1:433131318113:web:90370ca4001f4eef47f320"
        };

        const appId = 'school-freeboard-shared-v2';

        let db, auth;
        let isFirebaseConnected = false;
        let presenceInterval = null;
        let isFirstNotesSnapshot = true;
        let knownNoteSignatures = new Map();

        // ★ 編集モードの合言葉を変えたいときはこの行を変更
        const ADMIN_HASH = '#admin-administrator-()';

        function parseModeFromHash() {
            const h = (window.location.hash || '').trim();
            const isMonitorAuto = (h === '#monitor-auto');
            const isMonitor = (h === '#monitor' || isMonitorAuto);
            const isAdmin = (!isMonitor && h === ADMIN_HASH);
            return { isAdmin, isMonitor, isMonitorAuto };
        }

        const initialMode = parseModeFromHash();
        window.isAdminMode = initialMode.isAdmin;
        window.isMonitorMode = initialMode.isMonitor;
        window.isMonitorAuto = initialMode.isMonitorAuto;

        window.notesData = [];
        window.usersData = [];
        window.auditLogsData = [];
        window.currentUser = null;
        window.loginSessions = JSON.parse(localStorage.getItem('freeboard_login_sessions') || '[]');
        window.forcedLogoutUids = new Set(JSON.parse(localStorage.getItem('freeboard_forced_logout_uids') || '[]'));

        function isUidForceLoggedOut(uid) {
            if (!uid) return false;
            if (window.forcedLogoutUids && window.forcedLogoutUids.has(uid)) return true;
            const userDoc = (window.usersData || []).find(u => u.uid === uid);
            return Boolean(userDoc && userDoc.forceLogout);
        }

        window.applyModeUI = function() {
            const mode = parseModeFromHash();
            window.isAdminMode = mode.isAdmin;
            window.isMonitorMode = mode.isMonitor;
            window.isMonitorAuto = mode.isMonitorAuto;

            const headerEl = document.getElementById('main-header');
            const subTitleEl = document.getElementById('header-subtitle');
            const historyBtn = document.getElementById('admin-history-btn');
            const bottomNav = document.getElementById('bottom-mode-tabs');
            const plusFab = document.getElementById('plus-button-container');
            const loginModal = document.getElementById('login-modal');
            const searchModal = document.getElementById('search-modal');
            const noteModal = document.getElementById('note-modal');
            const historyModal = document.getElementById('history-modal');
            const adminDetailModal = document.getElementById('admin-detail-modal');

            if (window.isMonitorMode) {
                if (headerEl) headerEl.classList.add('hidden');
                if (bottomNav) bottomNav.classList.add('hidden');
                if (plusFab) plusFab.classList.add('hidden');
                if (loginModal) loginModal.classList.add('hidden');
                if (searchModal) searchModal.classList.add('hidden');
                if (noteModal) noteModal.classList.add('hidden');
                if (historyModal) historyModal.classList.add('hidden');
                if (adminDetailModal) adminDetailModal.classList.add('hidden');

                const boardView = document.getElementById('board-view');
                const accountView = document.getElementById('account-view');
                if (boardView) boardView.classList.remove('hidden');
                if (accountView) accountView.classList.add('hidden');

                if (typeof startMonitorAutoCycle === 'function') startMonitorAutoCycle();
                if (typeof fitAllNotes === 'function') fitAllNotes(true);
            } else {
                if (typeof stopMonitorAutoCycle === 'function') stopMonitorAutoCycle();
                if (typeof clearMonitorFocus === 'function') clearMonitorFocus();
                if (headerEl) headerEl.classList.remove('hidden');
                if (plusFab) plusFab.classList.remove('hidden');

                if (window.isAdminMode) {
                    if (subTitleEl) {
                        subTitleEl.innerText = '編集モード';
                        subTitleEl.className = 'text-[10px] font-bold text-indigo-600 block leading-tight';
                    }
                    if (historyBtn) historyBtn.classList.remove('hidden');
                    if (bottomNav) bottomNav.classList.remove('hidden');
                } else {
                    if (subTitleEl) {
                        subTitleEl.innerText = '';
                        subTitleEl.className = 'text-[10px] text-slate-400 leading-tight';
                    }
                    if (historyBtn) historyBtn.classList.add('hidden');
                    if (bottomNav) bottomNav.classList.add('hidden');
                    if (typeof switchMainTab === 'function' && typeof currentMainTab !== 'undefined' && currentMainTab !== 'board') {
                        switchMainTab('board');
                    }
                }
            }
        };

        window.addEventListener('hashchange', () => {
            window.applyModeUI();
            if (typeof renderNotes === 'function') renderNotes();
        });

        function detectAndHighlightMonitorChanges(notes) {
            const nextMap = new Map();
            const changedOrNewIds = [];

            notes.forEach(n => {
                const sig = JSON.stringify({
                    title: n.title || '',
                    content: n.content || '',
                    author: n.author || '',
                    color: n.color || 'yellow',
                    updatedAt: n.updatedAt || '',
                    createdAt: n.createdAt || ''
                });
                nextMap.set(n.id, sig);

                if (!isFirstNotesSnapshot) {
                    const prevSig = knownNoteSignatures.get(n.id);
                    if (prevSig !== sig) {
                        changedOrNewIds.push(n.id);
                    }
                }
            });

            knownNoteSignatures = nextMap;
            isFirstNotesSnapshot = false;

            if (window.isMonitorMode && changedOrNewIds.length > 0 && typeof spotlightNoteForMonitor === 'function') {
                spotlightNoteForMonitor(changedOrNewIds[0], 60000);
            }
        }

        window.initFirebase = async function() {
            const btn = document.getElementById('google-login-btn');
            if (btn) {
                btn.disabled = false;
                btn.innerHTML = '<div class="bg-white p-1 rounded-full"><svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg></div><span class="text-sm">Googleアカウントでログイン</span>';
            }

            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                try {
                    const result = await getRedirectResult(auth);
                    if (result && result.user) {
                        await handleSuccessfulUser(result.user);
                    }
                } catch (redirectErr) {
                    console.warn("Redirect result info:", redirectErr);
                }

                onAuthStateChanged(auth, async (user) => {
                    if (user && !user.isAnonymous) {
                        await handleSuccessfulUser(user);
                    } else {
                        if (!window.currentUser && !window.isMonitorMode) {
                            openLoginModal();
                        }
                    }
                    if (typeof renderNotes === 'function') renderNotes();
                });

                isFirebaseConnected = true;
                updateConnectionIndicator(true);

                // 付箋データのリアルタイム同期
                const notesColRef = collection(db, 'artifacts', appId, 'public', 'data', 'notes');
                onSnapshot(notesColRef, (snapshot) => {
                    const notes = [];
                    snapshot.forEach(docSnap => {
                        notes.push({ id: docSnap.id, ...docSnap.data() });
                    });

                    window.notesData = notes;
                    detectAndHighlightMonitorChanges(notes);
                    if (typeof renderNotes === 'function') renderNotes();
                    if (typeof renderSearchList === 'function') renderSearchList();
                }, (error) => {
                    console.warn("Firestore sync warning, falling back to local:", error);
                    fallbackToLocal();
                });

                // ユーザー一覧・オンライン状態・強制ログアウト状態のリアルタイム同期
                const usersColRef = collection(db, 'artifacts', appId, 'public', 'data', 'users');
                onSnapshot(usersColRef, async (snapshot) => {
                    const users = [];
                    snapshot.forEach(docSnap => {
                        users.push({ uid: docSnap.id, ...docSnap.data() });
                    });
                    window.usersData = users;

                    // 自分が強制ログアウトされた場合、サインアウトして再ログインを促す
                    if (window.currentUser && window.currentUser.uid) {
                        const me = users.find(u => u.uid === window.currentUser.uid);
                        if (me && me.forceLogout) {
                            await forceSignOutCurrentUser();
                            return;
                        }
                    }

                    if (typeof renderAccountLists === 'function') renderAccountLists();
                }, (error) => {
                    console.warn("Users sync warning:", error);
                });

                // すべての変更・作成・削除履歴のリアルタイム同期
                const logsColRef = collection(db, 'artifacts', appId, 'public', 'data', 'audit_logs');
                onSnapshot(logsColRef, (snapshot) => {
                    const logs = [];
                    snapshot.forEach(docSnap => {
                        logs.push({ id: docSnap.id, ...docSnap.data() });
                    });
                    logs.sort((a, b) => new Date(b.timestamp || 0).getTime() - new Date(a.timestamp || 0).getTime());
                    window.auditLogsData = logs;
                    if (typeof renderHistoryList === 'function') renderHistoryList();
                }, (error) => {
                    console.warn("Audit logs sync warning:", error);
                });

            } catch (e) {
                console.warn("Firebase connection failed, falling back to local:", e);
                fallbackToLocal();
            }
        };

        window.recordAuditLog = async function(actionType, noteObj, beforeNoteObj = null) {
            const now = new Date().toISOString();
            const actorName = window.currentUser ? window.currentUser.displayName : '不明';
            const actorEmail = window.currentUser ? window.currentUser.email : '';
            const actorUid = window.currentUser ? window.currentUser.uid : (window.myCreatorId || '');

            const logEntry = {
                id: 'log_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6),
                action: actionType, // 'create' | 'edit' | 'delete' | 'restore'
                noteId: noteObj ? noteObj.id : '',
                actorName: actorName,
                actorEmail: actorEmail,
                actorUid: actorUid,
                timestamp: now,
                noteSnapshot: noteObj ? JSON.parse(JSON.stringify(noteObj)) : null,
                beforeSnapshot: beforeNoteObj ? JSON.parse(JSON.stringify(beforeNoteObj)) : null
            };

            const localLogs = JSON.parse(localStorage.getItem('freeboard_local_logs') || '[]');
            localLogs.unshift(logEntry);
            localStorage.setItem('freeboard_local_logs', JSON.stringify(localLogs.slice(0, 200)));

            window.auditLogsData = [logEntry, ...(window.auditLogsData || []).filter(l => l.id !== logEntry.id)];
            window.auditLogsData.sort((a, b) => new Date(b.timestamp || 0).getTime() - new Date(a.timestamp || 0).getTime());
            if (typeof renderHistoryList === 'function') renderHistoryList();

            if (isFirebaseConnected && db) {
                try {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'audit_logs', logEntry.id), logEntry);
                } catch (e) {
                    console.warn("Failed to save audit log:", e);
                }
            }
        };

        async function syncUserPresence(user, isOnline, extraFields = {}) {
            if (!user) return;
            const now = new Date().toISOString();
            const userPayload = {
                uid: user.uid,
                displayName: user.displayName || '名無しさん',
                email: user.email || '',
                photoURL: user.photoURL || '',
                isOnline: isOnline,
                forceLogout: false,
                lastLoginAt: user.lastLoginAt || now,
                lastActiveAt: now,
                ...extraFields
            };

            const sessions = JSON.parse(localStorage.getItem('freeboard_login_sessions') || '[]');
            const idx = sessions.findIndex(s => s.uid === user.uid);
            if (idx >= 0) {
                sessions[idx] = { ...sessions[idx], ...userPayload };
            } else {
                sessions.push(userPayload);
            }
            window.loginSessions = sessions;
            localStorage.setItem('freeboard_login_sessions', JSON.stringify(sessions));

            if (isFirebaseConnected && db) {
                try {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', user.uid), userPayload, { merge: true });
                } catch (e) {
                    console.warn("Failed to sync user presence:", e);
                }
            }
            if (typeof renderAccountLists === 'function') renderAccountLists();
        }

        function startPresenceHeartbeat() {
            if (presenceInterval) clearInterval(presenceInterval);
            presenceInterval = setInterval(() => {
                if (window.currentUser && document.visibilityState === 'visible') {
                    syncUserPresence(window.currentUser, true);
                }
            }, 30000);
        }

        async function forceSignOutCurrentUser() {
            if (presenceInterval) clearInterval(presenceInterval);
            try {
                if (auth) await signOut(auth);
            } catch (e) {
                console.warn("Sign out error:", e);
            }
            window.currentUser = null;
            updateUserIconUI();
            if (!window.isMonitorMode) {
                openLoginModal();
            }
        }

        async function handleSuccessfulUser(user) {
            if (isUidForceLoggedOut(user.uid)) {
                await forceSignOutCurrentUser();
                return;
            }
            const now = new Date().toISOString();
            window.currentUser = {
                uid: user.uid,
                displayName: user.displayName || '名無しさん',
                email: user.email || '',
                photoURL: user.photoURL || '',
                lastLoginAt: now
            };
            window.myCreatorId = user.uid;

            await syncUserPresence(window.currentUser, true, { forceLogout: false });
            startPresenceHeartbeat();
            updateUserIconUI();
            closeLoginModal();
        }

        document.addEventListener('visibilitychange', () => {
            if (window.currentUser) {
                syncUserPresence(window.currentUser, document.visibilityState === 'visible');
            }
        });
        window.addEventListener('beforeunload', () => {
            if (window.currentUser) {
                syncUserPresence(window.currentUser, false);
            }
        });

        function resetLoginButtonUI() {
            const btn = document.getElementById('google-login-btn');
            if (btn) {
                btn.disabled = false;
                btn.innerHTML = '<div class="bg-white p-1 rounded-full"><svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg></div><span class="text-sm">Googleアカウントでログイン</span>';
            }
        }

        window.googleLogin = async function() {
            const btn = document.getElementById('google-login-btn');
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i><span>Google認証画面へ接続中...</span>';
            }
            try {
                const provider = new GoogleAuthProvider();
                try {
                    await signInWithPopup(auth, provider);
                } catch (popupErr) {
                    console.warn("Popup blocked or failed, falling back to redirect:", popupErr);
                    await signInWithRedirect(auth, provider);
                }
            } catch (e) {
                console.error("Google Login failed:", e);
                alert("ログインに失敗しました。\nエラー: " + e.message);
                resetLoginButtonUI();
            }
        };

        window.logoutUser = async function() {
            if (confirm("ログアウトしますか？")) {
                try {
                    if (presenceInterval) clearInterval(presenceInterval);
                    if (window.currentUser) {
                        await syncUserPresence(window.currentUser, false, { forceLogout: false });
                    }
                    await signOut(auth);
                    window.currentUser = null;
                    updateUserIconUI();
                    resetLoginButtonUI();
                    openLoginModal();
                } catch(e) {
                    console.error("Logout failed:", e);
                }
            }
        };

        // アカウント一覧のゴミ箱ボタンから対象アカウントをログアウトさせる（再ログイン必須化）
        window.kickAccountToReLogin = async function(targetUid, targetName) {
            if (!window.isAdminMode || !targetUid) return;
            const label = targetName ? `${targetName} さん` : 'このアカウント';
            if (!confirm(`${label} をログアウトさせますか？再度ログインが必要になります。`)) return;

            window.forcedLogoutUids.add(targetUid);
            localStorage.setItem('freeboard_forced_logout_uids', JSON.stringify(Array.from(window.forcedLogoutUids)));

            const sessions = (window.loginSessions || []).map(s =>
                s.uid === targetUid ? { ...s, isOnline: false, forceLogout: true } : s
            );
            window.loginSessions = sessions;
            localStorage.setItem('freeboard_login_sessions', JSON.stringify(sessions));

            window.usersData = (window.usersData || []).map(u =>
                u.uid === targetUid ? { ...u, isOnline: false, forceLogout: true } : u
            );

            if (isFirebaseConnected && db) {
                try {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', targetUid), {
                        isOnline: false,
                        forceLogout: true,
                        forcedLogoutAt: new Date().toISOString()
                    }, { merge: true });
                } catch (e) {
                    console.warn("Failed to update forceLogout in Firestore:", e);
                }
            }

            if (window.currentUser && window.currentUser.uid === targetUid) {
                await forceSignOutCurrentUser();
                return;
            }

            if (typeof renderAccountLists === 'function') renderAccountLists();
        };

        function fallbackToLocal() {
            isFirebaseConnected = false;
            updateConnectionIndicator(false);
            const saved = localStorage.getItem('freeboard_local_notes');
            window.notesData = saved ? JSON.parse(saved) : [];
            const savedLogs = localStorage.getItem('freeboard_local_logs');
            window.auditLogsData = savedLogs ? JSON.parse(savedLogs) : [];

            if (!window.currentUser && !window.isMonitorMode) {
                openLoginModal();
            }

            if (typeof renderNotes === 'function') renderNotes();
            if (typeof renderSearchList === 'function') renderSearchList();
            if (typeof renderAccountLists === 'function') renderAccountLists();
            if (typeof renderHistoryList === 'function') renderHistoryList();
        }

        function updateConnectionIndicator(isConnected) {
            const indicator = document.getElementById('connection-indicator');
            const ping = document.getElementById('connection-ping');
            if (!indicator) return;

            if (isConnected) {
                indicator.className = 'w-3 h-3 rounded-full bg-emerald-500 relative flex items-center justify-center';
                if (ping) ping.classList.remove('hidden');
            } else {
                indicator.className = 'w-3 h-3 rounded-full bg-amber-500 relative flex items-center justify-center';
                if (ping) ping.classList.add('hidden');
            }
        }

        function updateUserIconUI() {
            const container = document.getElementById('user-icon-container');
            if (!container) return;

            if (window.currentUser) {
                container.classList.remove('hidden');
                const avatar = window.currentUser.photoURL ?
                    `<img src="${window.currentUser.photoURL}" class="w-10 h-10 rounded-full object-cover border border-slate-200">` :
                    `<div class="w-10 h-10 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-sm">${(window.currentUser.displayName || 'G')[0]}</div>`;

                container.innerHTML = `
                    <div class="relative group">
                        <button onclick="toggleUserMenu()" class="flex items-center space-x-2 focus:outline-none interactive-btn" title="${window.currentUser.displayName}">
                            ${avatar}
                        </button>
                        <div id="user-dropdown-menu" class="absolute right-0 mt-2 w-48 bg-white rounded-2xl shadow-xl border border-slate-100 py-2 hidden z-50">
                            <div class="px-4 py-2 border-b border-slate-100">
                                <p class="text-xs font-bold text-slate-800 truncate">${escapeHtml(window.currentUser.displayName)}</p>
                                <p class="text-[10px] text-slate-400 truncate">${escapeHtml(window.currentUser.email || '')}</p>
                            </div>
                            <button onclick="logoutUser()" class="w-full text-left px-4 py-2 text-xs text-rose-600 hover:bg-rose-50 font-medium flex items-center space-x-2">
                                <i class="fa-solid fa-right-from-bracket"></i>
                                <span>ログアウト</span>
                            </button>
                        </div>
                    </div>
                `;
            } else {
                container.classList.add('hidden');
                container.innerHTML = '';
            }
        }

        window.toggleUserMenu = function() {
            const menu = document.getElementById('user-dropdown-menu');
            if (menu) menu.classList.toggle('hidden');
        };

        window.saveNoteToDb = async function(note) {
            if (isFirebaseConnected && db) {
                try {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'notes', note.id), note);
                } catch(e) {
                    console.error("Error saving note to cloud:", e);
                    saveLocalFallback(note);
                }
            } else {
                saveLocalFallback(note);
            }
        };

        function saveLocalFallback(note) {
            const idx = window.notesData.findIndex(n => n.id === note.id);
            if (idx >= 0) window.notesData[idx] = note;
            else window.notesData.push(note);
            localStorage.setItem('freeboard_local_notes', JSON.stringify(window.notesData));
            if (typeof renderNotes === 'function') renderNotes();
            if (typeof renderSearchList === 'function') renderSearchList();
        }

        window.deleteNoteFromDb = async function(noteId) {
            if (isFirebaseConnected && db) {
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'notes', noteId));
                } catch(e) {
                    console.error("Error deleting note from cloud:", e);
                    deleteLocalFallback(noteId);
                }
            } else {
                deleteLocalFallback(noteId);
            }
        };

        function deleteLocalFallback(noteId) {
            window.notesData = window.notesData.filter(n => n.id !== noteId);
            localStorage.setItem('freeboard_local_notes', JSON.stringify(window.notesData));
            if (typeof renderNotes === 'function') renderNotes();
            if (typeof renderSearchList === 'function') renderSearchList();
        }

        window.onload = () => {
            window.applyModeUI();
            window.initFirebase();
            if (typeof initCanvas === 'function') initCanvas();
            if (typeof renderAccountLists === 'function') renderAccountLists();
            if (typeof renderHistoryList === 'function') renderHistoryList();
        };
    </script>
    <style>
        body {

    <script>
        const colorMap = {
            yellow: { bg: 'bg-amber-100', border: 'border-amber-300', header: 'bg-amber-200/70', text: 'text-amber-900', accent: 'bg-amber-400' },
            pink: { bg: 'bg-rose-100', border: 'border-rose-300', header: 'bg-rose-200/70', text: 'text-rose-900', accent: 'bg-rose-400' },
            blue: { bg: 'bg-sky-100', border: 'border-sky-300', header: 'bg-sky-200/70', text: 'text-sky-900', accent: 'bg-sky-400' },
            green: { bg: 'bg-emerald-100', border: 'border-emerald-300', header: 'bg-emerald-200/70', text: 'text-emerald-900', accent: 'bg-emerald-400' },
            purple: { bg: 'bg-purple-100', border: 'border-purple-300', header: 'bg-purple-200/70', text: 'text-purple-900', accent: 'bg-purple-400' },
            white: { bg: 'bg-white', border: 'border-slate-200', header: 'bg-slate-100', text: 'text-slate-800', accent: 'bg-slate-300' }
        };

        let panX = 0;
        let panY = 0;
        let scale = 1.0;

        let pointers = new Map();
        let initialPinchDistance = null;
        let initialScale = 1;
        let isDraggingNote = false;
        let didDragMove = false;
        let activeNoteId = null;
        let noteStartX = 0, noteStartY = 0;
        let dragStartPointerX = 0, dragStartPointerY = 0;
        let hasInitializedView = false;

        let currentMainTab = 'board';
        let currentAccountSubTab = 'online';

        let monitorReturnTimeout = null;
        let monitorAutoInterval = null;
        let monitorAutoQueue = [];
        let monitorSpotlightNoteId = null;

        function parseAuthorParts(authorStr) {
            const tokens = (authorStr || '').trim().split(/[\s\u3000\-]+/).filter(Boolean);
            let grade = '';
            let cls = '';
            const nameTokens = [];

            tokens.forEach((tok) => {
                if (!grade && /^[1-3]年$/.test(tok)) {
                    grade = tok;
                } else if (!cls && /^[1-5]組$/.test(tok)) {
                    cls = tok;
                } else {
                    nameTokens.push(tok);
                }
            });

            return {
                grade: grade,
                cls: cls,
                name: nameTokens.join(' ')
            };
        }

        function updateClassOptions(gradeSelectId, classSelectId, defaultLabel, preferredClass = null) {
            const gradeEl = document.getElementById(gradeSelectId);
            const classEl = document.getElementById(classSelectId);
            if (!gradeEl || !classEl) return;

            const gradeVal = gradeEl.value;
            const targetClass = (preferredClass !== null) ? preferredClass : classEl.value;
            const maxClass = (gradeVal === '2年' || gradeVal === '3年') ? 4 : 5;

            let html = `<option value="">${defaultLabel}</option>`;
            for (let i = 1; i <= maxClass; i++) {
                const clsName = `${i}組`;
                html += `<option value="${clsName}">${clsName}</option>`;
            }
            classEl.innerHTML = html;

            if (targetClass && parseInt(targetClass, 10) <= maxClass) {
                classEl.value = targetClass;
            } else {
                classEl.value = '';
            }
        }

        function onSearchGradeChange() {
            updateClassOptions('grade-filter', 'class-filter', '学級すべて');
            renderSearchList();
        }

        // モニターモード：特定付箋へズームアップし、指定ミリ秒後に全体表示へ戻る
        function clearMonitorFocus() {
            if (monitorReturnTimeout) {
                clearTimeout(monitorReturnTimeout);
                monitorReturnTimeout = null;
            }
            monitorSpotlightNoteId = null;
        }

        function spotlightNoteForMonitor(noteId, durationMs = 60000) {
            if (!window.isMonitorMode) return;
            const note = (window.notesData || []).find(n => n.id === noteId);
            if (!note) return;

            const viewport = document.getElementById('viewport');
            if (!viewport || viewport.clientWidth === 0 || viewport.clientHeight === 0) return;

            if (monitorReturnTimeout) {
                clearTimeout(monitorReturnTimeout);
                monitorReturnTimeout = null;
            }

            monitorSpotlightNoteId = note.id;

            const noteWidth = 270;
            const noteHeight = 200;
            const targetScale = Math.max(
                0.6,
                Math.min(
                    2.2,
                    Math.min((viewport.clientWidth * 0.65) / noteWidth, (viewport.clientHeight * 0.65) / noteHeight)
                )
            );

            scale = targetScale;
            const cx = note.x + noteWidth / 2;
            const cy = note.y + noteHeight / 2;
            panX = (viewport.clientWidth / 2) - cx * scale;
            panY = (viewport.clientHeight / 2) - cy * scale;
            updateTransform();
            updateMonitorHighlightClasses();

            monitorReturnTimeout = setTimeout(() => {
                monitorSpotlightNoteId = null;
                updateMonitorHighlightClasses();
                if (window.isMonitorMode) {
                    fitAllNotes(true);
                }
            }, durationMs);
        }

        function refillRandomMonitorQueue() {
            const ids = (window.notesData || []).map(n => n.id);
            for (let i = ids.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [ids[i], ids[j]] = [ids[j], ids[i]];
            }
            monitorAutoQueue = ids;
        }

        function stepMonitorAuto() {
            if (!window.isMonitorMode || !window.isMonitorAuto) return;
            const validIds = new Set((window.notesData || []).map(n => n.id));
            monitorAutoQueue = monitorAutoQueue.filter(id => validIds.has(id));
            if (monitorAutoQueue.length === 0) {
                refillRandomMonitorQueue();
            }
            const nextId = monitorAutoQueue.shift();
            if (nextId) {
                spotlightNoteForMonitor(nextId, 30000);
            }
        }

        function startMonitorAutoCycle() {
            stopMonitorAutoCycle();
            if (!window.isMonitorMode || !window.isMonitorAuto) return;
            refillRandomMonitorQueue();
            stepMonitorAuto();
            monitorAutoInterval = setInterval(() => {
                stepMonitorAuto();
            }, 30000);
        }

        function stopMonitorAutoCycle() {
            if (monitorAutoInterval) {
                clearInterval(monitorAutoInterval);
                monitorAutoInterval = null;
            }
        }

        function updateMonitorHighlightClasses() {
            document.querySelectorAll('.sticky-note').forEach(el => {
                if (window.isMonitorMode && monitorSpotlightNoteId && el.id === `note-${monitorSpotlightNoteId}`) {
                    el.classList.add('ring-4', 'ring-indigo-600');
                } else {
                    el.classList.remove('ring-4', 'ring-indigo-600');
                }
            });
        }

        // 変更履歴モーダル開閉・描画・詳細表示・復元（編集モード時のみ）
        function openHistoryModal() {
            if (!window.isAdminMode) return;
            renderHistoryList();
            showModal('history-modal');
        }

        function closeHistoryModal() {
            closeModalById('history-modal');
        }

        function getActionLabel(action) {
            if (action === 'delete') return '削除';
            if (action === 'edit') return '編集';
            if (action === 'restore') return '復元';
            return '作成';
        }

        function renderHistoryList() {
            const container = document.getElementById('history-results-list');
            if (!container) return;

            const logs = window.auditLogsData || [];
            if (logs.length === 0) {
                container.innerHTML = `
                    <div class="py-12 text-center text-slate-400">
                        <i class="fa-regular fa-clock text-2xl mb-2 block"></i>
                        <p class="text-xs">まだ変更履歴はありません</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = logs.map(log => {
                const snap = log.noteSnapshot || log.beforeSnapshot || {};
                const colors = colorMap[snap.color] || colorMap.yellow;
                const timeStr = log.timestamp ? new Date(log.timestamp).toLocaleString('ja-JP') : '時刻不明';
                const actor = log.actorName || snap.userName || snap.author || 'だれか';

                let badgeHtml = '';
                let summaryText = '';

                if (log.action === 'delete') {
                    badgeHtml = `<span class="text-[11px] font-bold bg-rose-100 text-rose-700 px-2.5 py-0.5 rounded-full shrink-0">削除</span>`;
                    summaryText = `${actor}が削除しました`;
                } else if (log.action === 'edit') {
                    badgeHtml = `<span class="text-[11px] font-bold bg-amber-100 text-amber-800 px-2.5 py-0.5 rounded-full shrink-0">編集</span>`;
                    summaryText = `${actor}が編集しました`;
                } else if (log.action === 'restore') {
                    badgeHtml = `<span class="text-[11px] font-bold bg-indigo-100 text-indigo-700 px-2.5 py-0.5 rounded-full shrink-0">復元</span>`;
                    summaryText = `${actor}が復元しました`;
                } else {
                    badgeHtml = `<span class="text-[11px] font-bold bg-emerald-100 text-emerald-700 px-2.5 py-0.5 rounded-full shrink-0">作成</span>`;
                    summaryText = `${actor}が作成しました`;
                }

                return `
                    <div onclick="openHistoryDetailModal('${log.id}')" class="p-3.5 rounded-2xl border ${colors.border} ${colors.bg} cursor-pointer hover:shadow-md active:scale-[0.99] transition flex items-center justify-between gap-3">
                        <div class="flex items-center space-x-2.5 min-w-0">
                            ${badgeHtml}
                            <div class="min-w-0">
                                <p class="text-xs sm:text-sm font-bold text-slate-800 truncate">${escapeHtml(summaryText)}</p>
                                <p class="text-[11px] text-slate-500 truncate">${escapeHtml(snap.title || '無題')} ・ ${timeStr}</p>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-right text-xs text-slate-400 shrink-0"></i>
                    </div>
                `;
            }).join('');
        }

        function openHistoryDetailModal(logId) {
            if (!window.isAdminMode) return;
            const log = (window.auditLogsData || []).find(l => l.id === logId);
            if (!log) return;

            const container = document.getElementById('history-detail-content');
            if (!container) return;

            const beforeSnap = log.beforeSnapshot || null;
            const afterSnap = log.noteSnapshot || null;
            const primarySnap = afterSnap || beforeSnap || {};
            const actor = log.actorName || primarySnap.userName || primarySnap.author || 'だれか';
            const timeStr = log.timestamp ? new Date(log.timestamp).toLocaleString('ja-JP') : '時刻不明';

            let actionSentence = `${actor}が${getActionLabel(log.action)}しました`;
            let bodyDetailHtml = '';

            if (log.action === 'delete') {
                const delSnap = beforeSnap || afterSnap || {};
                bodyDetailHtml = `
                    <div class="bg-white p-4 rounded-2xl border border-rose-200 space-y-2">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold text-rose-700">削除された付箋</span>
                            <span class="text-[11px] text-slate-400">${escapeHtml(delSnap.author || delSnap.userName || '匿名')}</span>
                        </div>
                        <p class="text-sm font-bold text-slate-800">${escapeHtml(delSnap.title || '無題')}</p>
                        <p class="text-xs sm:text-sm text-slate-700 whitespace-pre-wrap bg-rose-50/50 p-3 rounded-xl border border-rose-100">${escapeHtml(delSnap.content || '')}</p>
                    </div>
                `;
            } else if (log.action === 'edit') {
                const bTitle = beforeSnap ? (beforeSnap.title || '無題') : '無題';
                const aTitle = afterSnap ? (afterSnap.title || '無題') : '無題';
                const bAuthor = beforeSnap ? (beforeSnap.author || beforeSnap.userName || '匿名') : '匿名';
                const aAuthor = afterSnap ? (afterSnap.author || afterSnap.userName || '匿名') : '匿名';
                const bContent = beforeSnap ? (beforeSnap.content || '') : '';
                const aContent = afterSnap ? (afterSnap.content || '') : '';

                bodyDetailHtml = `
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 space-y-2.5">
                        <p class="text-xs font-bold text-rose-600">変更前</p>
                        <p class="text-xs font-bold text-slate-800">タイトル: ${escapeHtml(bTitle)}</p>
                        <p class="text-[11px] text-slate-500">投稿者: ${escapeHtml(bAuthor)}</p>
                        <p class="text-xs sm:text-sm text-slate-700 whitespace-pre-wrap bg-slate-50 p-3 rounded-xl border border-slate-100">${escapeHtml(bContent)}</p>
                    </div>
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 space-y-2.5">
                        <p class="text-xs font-bold text-emerald-700">変更後</p>
                        <p class="text-xs font-bold text-slate-800">タイトル: ${escapeHtml(aTitle)}</p>
                        <p class="text-[11px] text-slate-500">投稿者: ${escapeHtml(aAuthor)}</p>
                        <p class="text-xs sm:text-sm text-slate-700 whitespace-pre-wrap bg-emerald-50/40 p-3 rounded-xl border border-emerald-100">${escapeHtml(aContent)}</p>
                    </div>
                `;
            } else {
                bodyDetailHtml = `
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 space-y-2">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold text-indigo-700">対象付箋</span>
                            <span class="text-[11px] text-slate-400">${escapeHtml(primarySnap.author || primarySnap.userName || '匿名')}</span>
                        </div>
                        <p class="text-sm font-bold text-slate-800">${escapeHtml(primarySnap.title || '無題')}</p>
                        <p class="text-xs sm:text-sm text-slate-700 whitespace-pre-wrap bg-slate-50 p-3 rounded-xl border border-slate-100">${escapeHtml(primarySnap.content || '')}</p>
                    </div>
                `;
            }

            const canRestore = (log.action === 'delete' || log.action === 'edit') && (beforeSnap || afterSnap);
            const restoreBtnHtml = canRestore ? `
                <button type="button" onclick="restoreNoteFromLog('${log.id}')" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-2xl shadow-sm transition active:scale-95 interactive-btn">
                    この付箋をボードに復元する
                </button>
            ` : '';

            container.innerHTML = `
                <div class="bg-white p-4 rounded-2xl border border-slate-200 flex items-center justify-between gap-2">
                    <div>
                        <p class="text-sm font-bold text-slate-800">${escapeHtml(actionSentence)}</p>
                        <p class="text-[11px] text-slate-400 mt-0.5">${timeStr}</p>
                    </div>
                </div>
                ${bodyDetailHtml}
                ${restoreBtnHtml}
            `;

            showModal('history-detail-modal');
        }

        function closeHistoryDetailModal() {
            closeModalById('history-detail-modal');
        }

        async function restoreNoteFromLog(logId) {
            if (!window.isAdminMode) return;
            const log = (window.auditLogsData || []).find(l => l.id === logId);
            if (!log) return;
            const sourceSnap = log.beforeSnapshot || log.noteSnapshot;
            if (!sourceSnap) return;

            if (!confirm('この状態の付箋をボードに復元しますか？')) return;

            const viewport = document.getElementById('viewport');
            const centerX = viewport ? (-panX + viewport.clientWidth / 2) / scale + (Math.random() * 50 - 25) : 2500;
            const centerY = viewport ? (-panY + viewport.clientHeight / 2) / scale + (Math.random() * 50 - 25) : 2500;

            const restoredNote = {
                ...sourceSnap,
                id: 'note_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6),
                x: Math.max(200, Math.min(4800, sourceSnap.x || centerX)),
                y: Math.max(200, Math.min(4800, sourceSnap.y || centerY)),
                updatedAt: new Date().toISOString()
            };

            window.notesData.push(restoredNote);
            await saveNoteToDb(restoredNote);
            await recordAuditLog('restore', restoredNote, null);

            closeHistoryDetailModal();
            closeHistoryModal();
            if (currentMainTab !== 'board') switchMainTab('board');
            renderNotes();
            renderSearchList();
        }

        // メインタブ切り替え（ボード / アカウント：編集モード時のみ）
        function switchMainTab(tab) {
            if (tab === 'account' && !window.isAdminMode) return;
            currentMainTab = tab;
            const boardView = document.getElementById('board-view');
            const accountView = document.getElementById('account-view');
            const boardTopControls = document.getElementById('board-top-controls');
            const tabBoardBtn = document.getElementById('main-tab-board');
            const tabAccountBtn = document.getElementById('main-tab-account');

            if (tab === 'board') {
                boardView.classList.remove('hidden');
                accountView.classList.add('hidden');
                boardTopControls.classList.remove('hidden');

                tabBoardBtn.className = 'px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition bg-indigo-600 text-white shadow-sm interactive-btn';
                tabAccountBtn.className = 'px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition text-slate-600 hover:bg-slate-100 interactive-btn';
            } else {
                boardView.classList.add('hidden');
                accountView.classList.remove('hidden');
                boardTopControls.classList.add('hidden');

                tabAccountBtn.className = 'px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition bg-indigo-600 text-white shadow-sm interactive-btn';
                tabBoardBtn.className = 'px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition text-slate-600 hover:bg-slate-100 interactive-btn';
                renderAccountLists();
            }
        }

        // アカウント画面のサブタブ切り替え（オンラインのアカウント / ログインしたアカウント）
        function switchAccountSubTab(subTab) {
            currentAccountSubTab = subTab;
            const onlineBtn = document.getElementById('subtab-online-btn');
            const loggedBtn = document.getElementById('subtab-logged-btn');
            const onlinePanel = document.getElementById('account-online-panel');
            const loggedPanel = document.getElementById('account-logged-panel');

            if (subTab === 'online') {
                onlinePanel.classList.remove('hidden');
                loggedPanel.classList.add('hidden');

                onlineBtn.className = 'py-2.5 px-3 rounded-xl text-xs sm:text-sm font-bold transition flex items-center justify-center space-x-2 bg-indigo-600 text-white shadow-sm interactive-btn';
                loggedBtn.className = 'py-2.5 px-3 rounded-xl text-xs sm:text-sm font-bold transition flex items-center justify-center space-x-2 text-slate-600 hover:bg-slate-50 interactive-btn';
            } else {
                onlinePanel.classList.add('hidden');
                loggedPanel.classList.remove('hidden');

                loggedBtn.className = 'py-2.5 px-3 rounded-xl text-xs sm:text-sm font-bold transition flex items-center justify-center space-x-2 bg-indigo-600 text-white shadow-sm interactive-btn';
                onlineBtn.className = 'py-2.5 px-3 rounded-xl text-xs sm:text-sm font-bold transition flex items-center justify-center space-x-2 text-slate-600 hover:bg-slate-50 interactive-btn';
            }
        }

        function renderAccountLists() {
            const onlinePanel = document.getElementById('account-online-panel');
            const loggedPanel = document.getElementById('account-logged-panel');
            const onlineBadge = document.getElementById('online-count-badge');
            const loggedBadge = document.getElementById('logged-count-badge');
            if (!onlinePanel || !loggedPanel) return;

            const userMap = new Map();

            (window.loginSessions || []).forEach(u => {
                if (u.uid) userMap.set(u.uid, { ...u });
            });

            (window.notesData || []).forEach(n => {
                if (n.creatorId && !userMap.has(n.creatorId)) {
                    userMap.set(n.creatorId, {
                        uid: n.creatorId,
                        displayName: n.userName || n.author || 'ユーザー',
                        email: n.userEmail || '',
                        photoURL: n.userPhoto || '',
                        isOnline: false,
                        lastLoginAt: n.createdAt || null,
                        lastActiveAt: n.createdAt || null
                    });
                }
            });

            (window.usersData || []).forEach(u => {
                if (u.uid) {
                    const existing = userMap.get(u.uid) || {};
                    userMap.set(u.uid, { ...existing, ...u });
                }
            });

            if (window.currentUser && window.currentUser.uid && !isUidForceLoggedOut(window.currentUser.uid)) {
                const existing = userMap.get(window.currentUser.uid) || {};
                userMap.set(window.currentUser.uid, {
                    ...existing,
                    ...window.currentUser,
                    isOnline: true,
                    forceLogout: false,
                    lastActiveAt: new Date().toISOString()
                });
            }

            const nowMs = Date.now();
            const allUsers = Array.from(userMap.values()).map(u => {
                const forcedOut = Boolean(u.forceLogout || isUidForceLoggedOut(u.uid));
                const lastActiveMs = u.lastActiveAt ? new Date(u.lastActiveAt).getTime() : 0;
                const isRecentlyActive = (nowMs - lastActiveMs) < 90000;
                const isSelf = Boolean(window.currentUser && u.uid === window.currentUser.uid && !forcedOut);
                return {
                    ...u,
                    effectivelyOnline: Boolean(!forcedOut && (isSelf || (u.isOnline && isRecentlyActive)))
                };
            });

            allUsers.sort((a, b) => {
                const ta = a.lastActiveAt ? new Date(a.lastActiveAt).getTime() : 0;
                const tb = b.lastActiveAt ? new Date(b.lastActiveAt).getTime() : 0;
                return tb - ta;
            });

            const onlineUsers = allUsers.filter(u => u.effectivelyOnline);

            if (onlineBadge) onlineBadge.innerText = onlineUsers.length;
            if (loggedBadge) loggedBadge.innerText = allUsers.length;

            if (onlineUsers.length === 0) {
                onlinePanel.innerHTML = `
                    <div class="bg-white rounded-3xl border border-slate-200 p-8 text-center text-slate-400">
                        <i class="fa-solid fa-user-clock text-2xl mb-2 block"></i>
                        <p class="text-xs">現在オンラインのアカウントはありません</p>
                    </div>
                `;
            } else {
                onlinePanel.innerHTML = onlineUsers.map(u => createAccountCardHtml(u, false)).join('');
            }

            if (allUsers.length === 0) {
                loggedPanel.innerHTML = `
                    <div class="bg-white rounded-3xl border border-slate-200 p-8 text-center text-slate-400">
                        <i class="fa-regular fa-address-book text-2xl mb-2 block"></i>
                        <p class="text-xs">ログインしたアカウントはまだありません</p>
                    </div>
                `;
            } else {
                loggedPanel.innerHTML = allUsers.map(u => createAccountCardHtml(u, true)).join('');
            }
        }

        function createAccountCardHtml(user, showTrashButton) {
            const isSelf = Boolean(window.currentUser && user.uid === window.currentUser.uid && user.effectivelyOnline);
            const initial = (user.displayName || 'U')[0];
            const avatarHtml = user.photoURL
                ? `<img src="${user.photoURL}" class="w-11 h-11 rounded-full object-cover border border-slate-200 shrink-0">`
                : `<div class="w-11 h-11 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-sm shrink-0">${escapeHtml(initial)}</div>`;

            const statusDot = user.effectivelyOnline
                ? `<span class="w-3 h-3 rounded-full bg-emerald-500 ring-2 ring-white absolute bottom-0 right-0"></span>`
                : `<span class="w-3 h-3 rounded-full bg-slate-300 ring-2 ring-white absolute bottom-0 right-0"></span>`;

            const timeLabel = user.lastLoginAt
                ? `最終ログイン: ${new Date(user.lastLoginAt).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}`
                : 'ログイン履歴あり';

            const emailLine = (window.isAdminMode && user.email)
                ? `<p class="text-[11px] text-slate-400 truncate">${escapeHtml(user.email)}</p>`
                : '';

            const trashBtnHtml = (showTrashButton && window.isAdminMode && user.uid)
                ? `<button type="button" onclick="event.stopPropagation(); kickAccountToReLogin('${escapeHtml(user.uid)}', '${escapeHtml(user.displayName || '名無しさん')}')" class="w-9 h-9 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 flex items-center justify-center transition active:scale-95 interactive-btn shrink-0" title="ログアウトさせる（再ログインが必要）">
                        <i class="fa-solid fa-trash-can text-xs"></i>
                   </button>`
                : '';

            return `
                <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between gap-3">
                    <div class="flex items-center space-x-3 min-w-0">
                        <div class="relative shrink-0">
                            ${avatarHtml}
                            ${statusDot}
                        </div>
                        <div class="min-w-0">
                            <div class="flex items-center space-x-1.5">
                                <p class="font-bold text-slate-800 text-xs sm:text-sm truncate">${escapeHtml(user.displayName || '名無しさん')}</p>

        function initCanvas() {
            const viewport = document.getElementById('viewport');

            viewport.addEventListener('pointerdown', (e) => {
                if (window.isMonitorMode) return;
                if (e.target.closest('.sticky-note') || e.target.closest('button') || e.target.closest('input') || e.target.closest('textarea') || e.target.closest('select')) return;
                pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            });

            viewport.addEventListener('pointermove', (e) => {
                if (window.isMonitorMode) return;
                if (!pointers.has(e.pointerId)) return;
                const prev = pointers.get(e.pointerId);
                const dx = e.clientX - prev.x;
                const dy = e.clientY - prev.y;
                pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

                if (pointers.size === 1 && !isDraggingNote) {
                    panX += dx;
                    panY += dy;
                    updateTransform();
                }
            });

            viewport.addEventListener('pointerup', (e) => {
                pointers.delete(e.pointerId);
                if (pointers.size < 2) initialPinchDistance = null;
            });
            viewport.addEventListener('pointercancel', (e) => {
                pointers.delete(e.pointerId);
                if (pointers.size < 2) initialPinchDistance = null;
            });

            viewport.addEventListener('touchstart', (e) => {
                if (window.isMonitorMode) return;
                if (e.touches.length === 2) {
                    initialPinchDistance = getHypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    initialScale = scale;
                }
            }, { passive: true });

            viewport.addEventListener('touchmove', (e) => {
                if (window.isMonitorMode) return;
                if (e.touches.length === 2 && initialPinchDistance) {
                    const currentDistance = getHypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );

                    const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                    const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;

                    const newScale = Math.max(0.2, Math.min(3.0, initialScale * (currentDistance / initialPinchDistance)));

                    panX = midX - (midX - panX) * (newScale / scale);
                    panY = midY - (midY - panY) * (newScale / scale);
                    scale = newScale;

                    updateTransform();
                }
            }, { passive: true });

            viewport.addEventListener('touchend', (e) => {
                if (e.touches.length < 2) {
                    initialPinchDistance = null;
                }
            }, { passive: true });

            renderNotes();
        }

        function fitAllNotes(force = false) {
            const viewport = document.getElementById('viewport');
            if (!viewport) return;

            if (!window.notesData || window.notesData.length === 0) {
                resetViewCenter();
                return;
            }

            if (hasInitializedView && !force) return;

            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            window.notesData.forEach(n => {
                if (n.x < minX) minX = n.x;
                if (n.y < minY) minY = n.y;
                if (n.x + 270 > maxX) maxX = n.x + 270;
                if (n.y + 200 > maxY) maxY = n.y + 200;
            });

            const padding = window.isMonitorMode ? 60 : 120;
            minX -= padding;
            minY -= padding;
            maxX += padding;
            maxY += padding;

            const boardWidth = maxX - minX;
            const boardHeight = maxY - minY;

            const vWidth = viewport.clientWidth;
            const vHeight = viewport.clientHeight;

            if (vWidth === 0 || vHeight === 0) return;

            const scaleX = vWidth / boardWidth;
            const scaleY = vHeight / boardHeight;

            scale = Math.max(0.2, Math.min(3.0, Math.min(scaleX, scaleY)));

            panX = (vWidth / 2) - ((minX + maxX) / 2) * scale;
            panY = (vHeight / 2) - ((minY + maxY) / 2) * scale;

            hasInitializedView = true;
            updateTransform();
        }

        function resetViewCenter() {
            const viewport = document.getElementById('viewport');
            if (!viewport) return;
            scale = 1.0;
            panX = (viewport.clientWidth / 2) - 2500;
            panY = (viewport.clientHeight / 2) - 2500;
            updateTransform();
        }

        function getHypot(x, y) {
            return Math.sqrt(x * x + y * y);
        }

        function updateTransform() {
            const canvas = document.getElementById('canvas');
            const viewport = document.getElementById('viewport');

            canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
            const zoomLabel = document.getElementById('zoom-level');
            if (zoomLabel) zoomLabel.innerText = Math.round(scale * 100) + '%';

            if (viewport) {
                const baseSize = 40;
                const scaledSize = baseSize * scale;
                viewport.style.setProperty('--bg-size', `${scaledSize}px ${scaledSize}px`);
                viewport.style.backgroundPosition = `${panX}px ${panY}px`;
            }
        }

        function zoomIn() {
            const viewport = document.getElementById('viewport');
            const cx = viewport.clientWidth / 2;
            const cy = viewport.clientHeight / 2;

            let currentPercent = Math.round(scale * 100);
            let nextPercent = Math.min(300, Math.floor((currentPercent + 20) / 20) * 20);
            if (nextPercent <= currentPercent) nextPercent = currentPercent + 20;
            if (nextPercent > 300) nextPercent = 300;

            const newScale = nextPercent / 100;
            panX = cx - (cx - panX) * (newScale / scale);
            panY = cy - (cy - panY) * (newScale / scale);
            scale = newScale;
            updateTransform();
        }

        function zoomOut() {
            const viewport = document.getElementById('viewport');
            const cx = viewport.clientWidth / 2;
            const cy = viewport.clientHeight / 2;

            let currentPercent = Math.round(scale * 100);
            let nextPercent = Math.max(20, Math.ceil((currentPercent - 20) / 20) * 20);
            if (nextPercent >= currentPercent) nextPercent = currentPercent - 20;
            if (nextPercent < 20) nextPercent = 20;

            const newScale = nextPercent / 100;
            panX = cx - (cx - panX) * (newScale / scale);
            panY = cy - (cy - panY) * (newScale / scale);
            scale = newScale;
            updateTransform();
        }

        function resetView() {
            fitAllNotes(true);
        }

                canvas.appendChild(div);

            if (!listContainer) return;

            const filteredNotes = window.notesData.filter(note => {
                const authorStr = note.author || '';

                    (note.title && note.title.toLowerCase().includes(keyword)) ||

                    (authorStr.toLowerCase().includes(keyword));

                return matchesKeyword && matchesGrade && matchesClass;

        function jumpToNote(id) {
            const note = window.notesData.find(n => n.id === id);

            const viewport = document.getElementById('viewport');

            scale = 1.0;
            const noteCenterX = note.x + 135;
            const noteCenterY = note.y + 90;
            panX = (viewport.clientWidth / 2) - noteCenterX * scale;
            panY = (viewport.clientHeight / 2) - noteCenterY * scale;
            updateTransform();

            setTimeout(() => {
                const el = document.getElementById(`note-${id}`);
                if (el) {
                    el.classList.add('ring-4', 'ring-indigo-600');
                    setTimeout(() => el.classList.remove('ring-4', 'ring-indigo-600'), 1800);

        function startDragNote(e, id) {
            if (window.isMonitorMode) return;
            e.stopPropagation();
            const note = window.notesData.find(n => n.id === id);
            if (!note) return;

            didDragMove = false;
            const canMove = (Boolean(window.currentUser) && note.creatorId === window.myCreatorId) || window.isAdminMode;

            if (!canMove) {
                pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
                return;
            }

            isDraggingNote = true;
            activeNoteId = id;
            dragStartPointerX = e.clientX;
            dragStartPointerY = e.clientY;

            noteStartX = note.x;
            noteStartY = note.y;

            const moveHandler = (moveEvent) => {
                if (!isDraggingNote || activeNoteId !== id) return;
                const rawDx = moveEvent.clientX - dragStartPointerX;
                const rawDy = moveEvent.clientY - dragStartPointerY;

                if (!didDragMove && Math.hypot(rawDx, rawDy) > 5) {
                    didDragMove = true;
                }

                if (!didDragMove) return;

                const dx = rawDx / scale;
                const dy = rawDy / scale;
                const targetNote = window.notesData.find(n => n.id === id);
                if (targetNote) {
                    targetNote.x = noteStartX + dx;
                    targetNote.y = noteStartY + dy;
                    const el = document.getElementById(`note-${id}`);
                    if (el) {
                        el.classList.add('no-anim');
                        el.style.transform = `translate(${targetNote.x}px, ${targetNote.y}px)`;
                    }
                }
            };

            const upHandler = () => {
                if (isDraggingNote && activeNoteId === id) {
                    isDraggingNote = false;
                    const el = document.getElementById(`note-${id}`);
                    if (el) el.classList.remove('no-anim');
                    if (didDragMove) {
                        const targetNote = window.notesData.find(n => n.id === id);
                        if (targetNote) saveNoteToDb(targetNote);
                        setTimeout(() => { didDragMove = false; }, 100);
                    }
                    activeNoteId = null;
                }
                window.removeEventListener('pointermove', moveHandler);
                window.removeEventListener('pointerup', upHandler);
            };

            window.addEventListener('pointermove', moveHandler);
            window.addEventListener('pointerup', upHandler);
        }

            gradeSelect.value = parsed.grade;
            updateClassOptions('note-grade-input', 'note-class-input', '選択', parsed.cls);
            document.getElementById('note-name-input').value = parsed.name;

            const colorRadio = document.querySelector(`input[name="note-color"][value="${note.color || 'yellow'}"]`);
            if (colorRadio) colorRadio.checked = true;

            showModal('note-modal');
        }

        async function confirmDelete(id) {
            if (window.isMonitorMode) return;
            if (!window.currentUser && !window.isAdminMode) return;
            const note = window.notesData.find(n => n.id === id);
            if (!note || (note.creatorId !== window.myCreatorId && !window.isAdminMode)) return;

            if (confirm('この付箋を削除してもよろしいですか？')) {
                const deletedSnap = JSON.parse(JSON.stringify(note));
                await deleteNoteFromDb(id);
                await recordAuditLog('delete', deletedSnap, deletedSnap);
            }
        }

        function showModal(modalId) {
            if (window.isMonitorMode) return;
            const modal = document.getElementById(modalId);
            if (!modal) return;
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                const content = modal.firstElementChild;
                if (content) content.classList.remove('scale-95');
            }, 10);
        }

        function closeModalById(modalId) {
            const modal = document.getElementById(modalId);
            if (!modal) return;
            modal.classList.add('opacity-0');
            const content = modal.firstElementChild;
            if (content) content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        function closeModal() {
            closeModalById('note-modal');
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            if (window.isMonitorMode) return;
            if (!window.currentUser && !window.isAdminMode) {
                openLoginModal(true);
                return;
            }

            const idInput = document.getElementById('note-id-input').value;
            let title = document.getElementById('note-title-input').value.trim();
            const content = document.getElementById('note-content-input').value.trim();

            const grade = document.getElementById('note-grade-input').value.trim();
            const cls = document.getElementById('note-class-input').value.trim();
            const name = document.getElementById('note-name-input').value.trim();

            let authorParts = [];
            if (grade) authorParts.push(grade);
            if (cls) authorParts.push(cls);
            if (name) authorParts.push(name);
            const author = authorParts.join(' ');

            if (!content) return;

            const now = new Date().toISOString();
            const currentUserName = window.currentUser ? window.currentUser.displayName : (name || '匿名');
            const currentUserPhoto = window.currentUser ? window.currentUser.photoURL : '';
            const currentUserEmail = window.currentUser ? window.currentUser.email : '';

            if (idInput) {
                const existingNote = window.notesData.find(n => n.id === idInput);
                if (existingNote && (existingNote.creatorId === window.myCreatorId || window.isAdminMode)) {
                    const beforeSnap = JSON.parse(JSON.stringify(existingNote));
                    const prevParsed = parseAuthorParts(existingNote.author || '');
                    const prevAutoTitle = prevParsed.name
                        ? (prevParsed.name + 'の挑戦')
                        : (existingNote.author ? (existingNote.author + 'の挑戦') : 'みんなの挑戦');

                    if (!title) {
                        if (name) title = name + 'の挑戦';
                        else if (author) title = author + 'の挑戦';
                        else title = 'みんなの挑戦';
                    } else if (name && name !== prevParsed.name && title === prevAutoTitle) {
                        title = name + 'の挑戦';
                    }

                    if (existingNote.content !== content || existingNote.title !== title || existingNote.author !== author) {
                        if (!existingNote.history) existingNote.history = [];
                        existingNote.history.push({
                            title: existingNote.title || '',
                            author: existingNote.author || '',
                            userName: existingNote.userName || existingNote.author || '匿名',
                            content: existingNote.content,
                            timestamp: existingNote.updatedAt || existingNote.createdAt || now
                        });
                    }

                    existingNote.title = title;
                    existingNote.content = content;
                    existingNote.author = author;
                    existingNote.color = document.querySelector('input[name="note-color"]:checked').value;
                    existingNote.updatedAt = now;
                    await saveNoteToDb(existingNote);
                    await recordAuditLog('edit', existingNote, beforeSnap);
                }
            } else {
                if (!title) {
                    if (name) title = name + 'の挑戦';
                    else if (author) title = author + 'の挑戦';
                    else title = 'みんなの挑戦';
                }

                const viewport = document.getElementById('viewport');
                const centerX = (-panX + viewport.clientWidth / 2) / scale + (Math.random() * 60 - 30);
                const centerY = (-panY + viewport.clientHeight / 2) / scale + (Math.random() * 60 - 30);

                const newNote = {
                    id: 'note_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6),
                    title: title,
                    content: content,
                    author: author,
                    color: document.querySelector('input[name="note-color"]:checked').value,
                    x: Math.max(200, Math.min(4800, centerX)),
                    y: Math.max(200, Math.min(4800, centerY)),
                    creatorId: window.myCreatorId,
                    userName: currentUserName,
                    userPhoto: currentUserPhoto,
                    userEmail: currentUserEmail,
                    createdAt: now,
                    updatedAt: null,
                    history: []
                };
                window.notesData.push(newNote);
                await saveNoteToDb(newNote);
                await recordAuditLog('create', newNote, null);
            }

            closeModal();
            renderNotes();
            renderSearchList();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
